        /* Animation : Avance et recule au survol */
        .caddy-container:hover {
            transform: translateX(20px); /* Il avance vers la droite */
        }

        /* Le panier (le bac) */
        .caddy-basket {
            position: absolute;
            top: 10px;
            left: 20px;
            width: 70px;
            height: 50px;
            border: 3px solid #ff0055;
            border-radius: 2px 2px 15px 15px;

        }

        /* Le grillage intérieur du panier */
        .caddy-basket::before {
            content: '';
            position: absolute;
            top: 50%;
            width: 100%;
            height: 3px;
            background: #ff0055;
            box-shadow: 0 0 10px #ff0055;
        }

        /* La poignée et le montant arrière */
        .caddy-handle {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 15px;
            height: 60px;
            border-left: 4px solid #ff0055;
            border-top: 4px solid #ff0055;
            border-radius: 5px 0 0 0;
            box-shadow: -2px -2px 10px #ff0055;
        }

        /* Les roues */
        .wheel {
            position: absolute;

            height: 12px;
            border: 3px solid #ff0055;
            border-radius: 50%;
            background: #000;
            box-shadow: 0 0 10px #ff0055;
        }

        .wheel-front { left: 70px; }
        .wheel-back { left: 25px; }

        /* Effet de lueur supplémentaire au survol */
        .caddy-container:hover .caddy-basket,
        .caddy-container:hover .caddy-handle,
        .caddy-container:hover .wheel {
            border-color: #ff5599;
            box-shadow: 0 0 25px #ff5599;
        }

        html, body {
            height: 100%;
            overflow: hidden; /* Empêche le scroll */

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            transition: background 3s ease;
            overflow-x: hidden;
            padding: 20px;
            position: relative;
            height: 100vh;
        }

        /* Ciel nocturne */
        body.night {
            background: linear-gradient(to bottom, #0a1931, #1a1a2e);
        }

        /* Soleil */
        .sun {
            position: fixed;
            top: 50px;
            right: 100px;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #FFD700, #FF8C00);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            z-index: 1;
            transition: all 3s ease;
            opacity: 1;
        }

        body.night .sun {
            opacity: 0;
            transform: translateY(200px);
        }

        /* Animation du soleil */
        @keyframes sunRise {
            0% { transform: translateY(200px) rotate(0deg); opacity: 0; }
            100% { transform: translateY(0) rotate(360deg); opacity: 1; }
        }

        @keyframes sunSet {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(200px) rotate(360deg); opacity: 0; }
        }

        /* Lune */
        .moon {
            position: fixed;
            top: 50px;
            right: 100px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #F0F8FF, #D3D3D3);
            border-radius: 50%;
            box-shadow: 
                0 0 40px rgba(255, 255, 255, 0.5),
                inset -10px -10px 20px rgba(0, 0, 0, 0.2);
            z-index: 1;
            transition: all 3s ease;
            opacity: 0;
        }

        body.night .moon {
            opacity: 1;
            animation: moonGlow 4s infinite alternate;
        }

        @keyframes moonGlow {
            0% { box-shadow: 0 0 40px rgba(255, 255, 255, 0.5); }
            100% { box-shadow: 0 0 60px rgba(255, 255, 255, 0.8); }
        }

        /* Cratères de lune */
        .moon::before, .moon::after {
            content: '';
            position: absolute;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 50%;
        }

        .moon::before {
            width: 15px;
            height: 15px;
            top: 20px;
            left: 15px;
        }

        .moon::after {
            width: 20px;
            height: 20px;
            bottom: 20px;
            right: 20px;
        }

        /* Étoiles */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s;
        }

        body.night .stars {
            opacity: 1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Nuages */
        .clouds {
            position: fixed;
            top: 100px;
            width: 100%;
            height: 200px;
            pointer-events: none;
            z-index: 0;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50px;
            animation: cloudsMove 60s infinite linear;
        }

        .cloud:nth-child(1) {
            width: 150px;
            height: 60px;
            top: 50px;
            left: -200px;
            animation-delay: 0s;
        }

        .cloud:nth-child(2) {
            width: 120px;
            height: 50px;
            top: 100px;
            left: -300px;
            animation-delay: 10s;
        }

        .cloud:nth-child(3) {
            width: 180px;
            height: 70px;
            top: 80px;
            left: -400px;
            animation-delay: 20s;
        }

        @keyframes cloudsMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 400px)); }
        }

        /* Fumée de cheminée */
        .chimney-smoke {

               top: -51px;
    left: 65%;

        .smoke {

            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            opacity: 0;
            filter: blur(5px);

        .smoke-1 {
            animation: smokeRise 6s infinite linear;

        .smoke-2 {
            animation: smokeRise 6s infinite linear 1s;
        }

        .smoke-3 {
            animation: smokeRise 6s infinite linear 2s;

        @keyframes smokeRise {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0.8;
            }
            50% {
                transform: translateY(-50px) scale(1);
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100px) scale(1.5);
                opacity: 0;
            }
        }

        /* Fenêtres */
        .window {
            position: absolute;
            width: 80px;
            height: 100px;
            background-color: #0a1a2a;
            border: 6px solid #2c3e50;
            border-radius: 8px;
            transition: all 1s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            overflow: hidden;
            cursor: pointer;
            box-shadow: 
                inset 0 0 15px rgba(0,0,0,0.7),
                0 5px 10px rgba(0,0,0,0.3);
        }

        /* Grille de fenêtre */
        .window::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(to right, transparent 49%, rgba(255,255,255,0.1) 49%, rgba(255,255,255,0.1) 51%, transparent 51%),

            z-index: 2;
        }

        .left-window {
            top: 60px;
            left: 70px;
        }

        .right-window {
            top: 60px;
            right: 70px;
        }

        /* Effet lumière intérieure */
        .window-light {
            position: absolute;
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255,223,0,0.9) 0%, rgba(255,140,0,0.7) 30%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: width 1.5s, height 1.5s;
            z-index: 1;
        }

        /* Fenêtre allumée */
        .window.on {
            background-color: #1a2a3a;
            border-color: #f39c12;
            box-shadow: 
                inset 0 0 30px rgba(255,195,0,0.5),
                0 0 30px rgba(255,165,0,0.6),
                0 0 60px rgba(255,140,0,0.3);
        }

        .window.on .window-light {
            width: 200px;
            height: 200px;
            animation: lightFlicker 2s infinite alternate;
        }

        @keyframes lightFlicker {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }

            height: 30px;
            background: radial-gradient(ellipse, rgba(255,165,0,0.4), transparent 70%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 1.5s;
            z-index: 1;
        }

        .window.on ~ .light-effect {
            opacity: 0.7;
        }

        .left-window ~ .light-effect {
            left: 80px;
        }

        .right-window ~ .light-effect {
            right: 80px;
        }

        /* État des lumières */
        .lights-status {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .light-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        body.night .light-indicator {
            background: rgba(0, 0, 0, 0.2);
            color: #f0f0f0;
        }

        .indicator-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e74c3c;
            box-shadow: 0 0 8px #e74c3c;
            transition: all 0.5s;
        }

        .indicator-dot.on {
            background: #2ecc71;
            box-shadow: 0 0 12px #2ecc71;
            animation: dotPulse 2s infinite;
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Instruction */
        .instruction {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #7f8c8d;
            font-style: italic;
            transition: color 3s;
        }

        body.night .instruction {
            color: #bdc3c7;
        }

        /* Responsive */
        @media (max-width: 650px) {
            .house-container {
                width: 100%;
                height: 400px;
                transform: scale(0.9);
            }
            
            .house {
                width: 300px;
                height: 250px;
            }
            
            .wall {
                height: 180px;
            }
            
            .roof {
                width: 340px;
                height: 80px;
                bottom: 180px;
                left: -20px;
            }
            
            .window {
                width: 60px;
                height: 80px;
            }
            
            .left-window {
                left: 40px;
            }
            
            .right-window {
                right: 40px;
            }

            .sun, .moon {
                width: 60px;
                height: 60px;
                right: 30px;
                top: 30px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .analog-clock {
                width: 100px;
                height: 100px;
            }

            .digital-timer {
                font-size: 1.5rem;
            }

            .cycle-info {
                min-width: 250px;
                font-size: 1rem;
                padding: 10px 15px;
            }

            .lights-status {
                gap: 10px;
            }

            .light-indicator {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }

        @media (max-height: 800px) {
            .container {
                transform: scale(0.9);
            }
        }
    </style>
</head>
<body>
    <!-- Soleil et Lune -->
    <div class="sun"></div>
    <div class="moon"></div>
    
    <!-- Nuages -->
    <div class="clouds">
        <div class="cloud"></div>
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>
    
    <!-- Étoiles -->
    <div class="stars" id="stars"></div>

    <div class="container">
        <h1>🌲 Maison en Bois - Cycle Automatique</h1>
        
        <div class="cycle-info" id="cycle-info">
            <span class="cycle-icon" id="cycle-icon">☀️</span>
            <span id="cycle-text">JOUR - Lumières éteintes</span>
        </div>
        
        <!-- Horloge analogique -->
        <div class="analog-clock" id="analog-clock">
            <div class="clock-center"></div>
            <div class="hour-hand" id="hour-hand"></div>
            <div class="minute-hand" id="minute-hand"></div>
            <div class="second-hand" id="second-hand"></div>
            <div class="clock-numbers">
                <div class="clock-number" style="top: 10px; left: 50px;">12</div>
                <div class="clock-number" style="top: 50px; right: 15px;">3</div>
                <div class="clock-number" style="bottom: 10px; left: 50px;">6</div>
                <div class="clock-number" style="top: 50px; left: 15px;">9</div>
            </div>
        </div>
        
        <!-- Timer digital -->
        <div class="digital-timer" id="digital-timer">01:00</div>
        
        <div class="house-container">
        <button class="neon-button">Voir nos produits</button>
            <!-- Sol -->
            <div class="ground"></div>
            
            <!-- Maison -->
            <div class="house">
                <!-- Cheminée et fumée -->
                <div class="chimney-smoke" id="chimney-smoke">
                    <div class="smoke smoke-1"></div>
                    <div class="smoke smoke-2"></div>
                    <div class="smoke smoke-3"></div>
                </div>
                <div class="chimney"></div>
                
                <!-- Toit -->
                <div class="roof"></div>
                
                <!-- Mur -->
                <div class="wall">
                    <!-- Fenêtre gauche -->
                    <div class="window left-window" id="left-window">
                        <div class="window-light"></div>
                        <!-- Effet lumière sur le sol -->
                        <div class="light-effect"></div>
                    </div>
                    
                    <!-- Fenêtre droite -->
                    <div class="window right-window" id="right-window">
                        <div class="window-light"></div>
                        <div class="light-effect"></div>
                    </div>
                    
                    <!-- Porte -->
                    <div class="door" id="door">
                        <div class="door-window"></div>
                        <div class="door-knob"></div>
                    </div>
                </div>
            </div>
        </div>
     




        
        <!-- État des lumières -->
        <div class="lights-status">
            <div class="light-indicator">
                <div class="indicator-dot" id="indicator-left"></div>
                <span>Fenêtre gauche</span>
            </div>
            <div class="light-indicator">
                <div class="indicator-dot" id="indicator-right"></div>
                <span>Fenêtre droite</span>
            </div>
            <div class="light-indicator">
                <div class="indicator-dot" id="indicator-door"></div>
                <span>Porte</span>
            </div>
        </div>
        
        <div class="instruction">
            Cycle automatique toutes les 60 secondes • Cliquez sur les fenêtres/porte pour contrôler manuellement
        </div>
    </div>
<div class="billboard-container">
        <div class="screen">
            <div class="title">Achat Immobilier</div>
            <div class="offer">Achat -50% réduction</div>
        </div>
        <div class="post"></div>
    </div>
<div class="caddy-container">
        <div class="caddy-handle"></div>
        <div class="caddy-basket"></div>
        <div class="wheel wheel-back"></div>
        <div class="wheel wheel-front"></div>
    </div>

    <script>
        // Créer les étoiles
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // Éléments DOM
        const body = document.body;
        const leftWindow = document.getElementById('left-window');
        const rightWindow = document.getElementById('right-window');
        const door = document.getElementById('door');
        const cycleText = document.getElementById('cycle-text');
        const cycleIcon = document.getElementById('cycle-icon');
        const cycleInfo = document.getElementById('cycle-info');
        const digitalTimer = document.getElementById('digital-timer');
        const hourHand = document.getElementById('hour-hand');
        const minuteHand = document.getElementById('minute-hand');
        const secondHand = document.getElementById('second-hand');
        const chimneySmoke = document.getElementById('chimney-smoke');
        
        // Indicateurs de lumière
        const indicatorLeft = document.getElementById('indicator-left');
        const indicatorRight = document.getElementById('indicator-right');
        const indicatorDoor = document.getElementById('indicator-door');

        // État du cycle
        let isDay = true;
        let timeLeft = 60; // 60 secondes par phase
        let timerInterval;
        let isCycling = false;
        let currentLightIndex = 0;
        let smokeInterval;

        // Ordre d'allumage/extinction des lumières
        const lightOrder = ['leftWindow', 'rightWindow', 'door'];
        const lights = {
            leftWindow: { element: leftWindow, indicator: indicatorLeft },
            rightWindow: { element: rightWindow, indicator: indicatorRight },
            door: { element: door, indicator: indicatorDoor }
        };

        // Mettre à jour l'horloge analogique
        function updateAnalogClock(seconds) {
            const totalSeconds = 60 - seconds; // Inverse pour que l'aiguille bouge
            const secondDeg = (totalSeconds / 60) * 360;
            const minuteDeg = (totalSeconds / 3600) * 360;
            const hourDeg = (totalSeconds / 43200) * 360;
            
            secondHand.style.transform = `translate(-50%, -100%) rotate(${secondDeg}deg)`;
            minuteHand.style.transform = `translate(-50%, -100%) rotate(${minuteDeg}deg)`;
            hourHand.style.transform = `translate(-50%, -100%) rotate(${hourDeg}deg)`;
        }

        // Mettre à jour le timer digital
        function updateDigitalTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            digitalTimer.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Animation de la couleur
            if (timeLeft <= 10) {
                digitalTimer.style.color = '#e74c3c';
                digitalTimer.style.animation = 'pulse 0.5s infinite';
            } else {
                digitalTimer.style.color = '';
                digitalTimer.style.animation = '';
            }
        }

        // Activer/désactiver la fumée de cheminée
        function toggleSmoke(enable) {
            if (enable) {
                chimneySmoke.style.height = '100px';
                if (!smokeInterval) {
                    smokeInterval = setInterval(() => {
                        // La fumée est déjà animée via CSS
                    }, 6000);
                }
            } else {
                chimneySmoke.style.height = '0';
                if (smokeInterval) {
                    clearInterval(smokeInterval);
                    smokeInterval = null;
                }
            }
        }

        // Fonction pour démarrer le cycle
        function startCycle() {
            if (isCycling) return;
            isCycling = true;
            startTimer();
        }

        // Fonction du timer
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                
                // Mettre à jour les horloges
                updateAnalogClock(timeLeft);
                updateDigitalTimer();
                
                if (timeLeft <= 0) {
                    if (isDay) {
                        // Transition vers la nuit
                        startNightTransition();
                    } else {
                        // Transition vers le jour
                        startDayTransition();
                    }
                }
            }, 1000);
        }

        // Transition vers la nuit (allumage progressif)
        function startNightTransition() {
            isDay = false;
            body.classList.add('night');
            cycleText.textContent = 'NUIT - Allumage progressif...';
            cycleIcon.textContent = '🌙';
            cycleInfo.style.background = 'rgba(52, 152, 219, 0.3)';
            
            // Activer la fumée de cheminée la nuit
            toggleSmoke(true);
            
            // Réinitialiser le timer
            timeLeft = 60;
            updateDigitalTimer();
            updateAnalogClock(timeLeft);
            
            // Allumer les lumières une par une avec délai
            lightOrder.forEach((lightName, index) => {
                setTimeout(() => {
                    toggleLight(lightName, true);
                    
                    // Si c'est la dernière lumière, mettre à jour le texte
                    if (index === lightOrder.length - 1) {
                        setTimeout(() => {
                            cycleText.textContent = 'NUIT - Toutes les lumières allumées';
                        }, 1000);
                    }
                }, index * 1000); // 1 seconde entre chaque lumière
            });
        }

        // Transition vers le jour (extinction progressive)
        function startDayTransition() {
            isDay = true;
            body.classList.remove('night');
            cycleText.textContent = 'JOUR - Extinction progressive...';
            cycleIcon.textContent = '☀️';
            cycleInfo.style.background = 'rgba(255, 193, 7, 0.3)';
            
            // Désactiver la fumée de cheminée le jour
            toggleSmoke(false);
            
            // Réinitialiser le timer
            timeLeft = 60;
            updateDigitalTimer();
            updateAnalogClock(timeLeft);
            
            // Éteindre les lumières une par une avec délai
            lightOrder.forEach((lightName, index) => {
                setTimeout(() => {
                    toggleLight(lightName, false);
                    
                    // Si c'est la dernière lumière, mettre à jour le texte
                    if (index === lightOrder.length - 1) {
                        setTimeout(() => {
                            cycleText.textContent = 'JOUR - Toutes les lumières éteintes';
                        }, 1000);
                    }
                }, index * 1000); // 1 seconde entre chaque lumière
            });
        }

        // Basculer une lumière spécifique
        function toggleLight(lightName, turnOn) {
            const light = lights[lightName];
            if (!light) return;
            
            const shouldTurnOn = turnOn !== undefined ? turnOn : !light.element.classList.contains('on');
            
            if (shouldTurnOn) {
                light.element.classList.add('on');
                light.indicator.classList.add('on');
            } else {
                light.element.classList.remove('on');
                light.indicator.classList.remove('on');
            }
            
            // Vibration pour feedback tactile
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }
        }

        // Clic direct sur les fenêtres/porte (contrôle manuel)
        leftWindow.addEventListener('click', () => toggleLight('leftWindow'));
        rightWindow.addEventListener('click', () => toggleLight('rightWindow'));
        door.addEventListener('click', () => toggleLight('door'));

        // Initialiser avec les lumières éteintes
        function initLights() {
            lightOrder.forEach(lightName => {
                toggleLight(lightName, false);
            });
            cycleText.textContent = 'JOUR - Lumières éteintes';
            cycleIcon.textContent = '☀️';
            toggleSmoke(false);
        }

        // Effet d'apparition progressive
        document.addEventListener('DOMContentLoaded', () => {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 1s';
            
            setTimeout(() => {
                document.body.style.opacity = '1';
                initLights();
                updateDigitalTimer();
                updateAnalogClock(timeLeft);
                startCycle();
            }, 100);
        });

        // Animation du soleil au chargement
        setTimeout(() => {
            document.querySelector('.sun').style.animation = 'sunRise 2s ease-out';
        }, 500);

        // Empêcher le scroll avec la roue de la souris
        document.addEventListener('wheel', (e) => {
            e.preventDefault();
        }, { passive: false });

        // Empêcher le scroll avec le toucher
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        // Instructions console
        console.log('🌲 Maison en Bois - Cycle Automatique 🌲');
        console.log('Cycle automatique toutes les 60 secondes');
        console.log('• Jour → Nuit : Allumage progressif des lumières');
        console.log('• Nuit → Jour : Extinction progressive des lumières');
        console.log('• Horloge analogique et digitale synchronisées');
        console.log('• Fumée de cheminée la nuit uniquement');
        console.log('• Pas de scroll - Tout est visible à l\'écran');
    </script>
</body>
</html>
